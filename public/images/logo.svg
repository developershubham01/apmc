<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D06B"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8F7113"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2D54"/>
      <stop offset="100%" stop-color="#0B1528"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B1528" flood-opacity="0.3"/>
    </filter>
    <path id="textCircle" d="M 60,250 A 190,190 0 1,1 440,250 A 190,190 0 1,1 60,250" fill="none"/>
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)"/>
  
  <!-- Red/Crimson Outer Border Ring -->
  <circle cx="250" cy="250" r="226" fill="#A81D24" stroke="#FFFFFF" stroke-width="3"/>
  
  <!-- White Text Ribbon -->
  <path d="M 250,30 A 220,220 0 0,1 470,250 A 220,220 0 0,1 250,470 A 220,220 0 0,1 30,250 A 220,220 0 0,1 250,30 Z" fill="#A81D24"/>
  
  <!-- Inner White Circle -->
  <circle cx="250" cy="250" r="165" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="5"/>

  <!-- Upper Arch Text -->
  <path id="topArch" d="M 70,250 A 180,180 0 0,1 430,250" fill="none"/>
  <text font-family="'Inter', 'Arial Black', sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" letter-spacing="3.5">
    <textPath href="#topArch" startOffset="50%" text-anchor="middle">
      NAVI MUMBAI MERCHANTS' CHAMBER
    </textPath>
  </text>

  <!-- Lower Arch Text -->
  <path id="bottomArch" d="M 430,250 A 180,180 0 0,1 70,250" fill="none"/>
  <text font-family="'Inter', 'Arial Black', sans-serif" font-size="20" font-weight="800" fill="#F2D06B" letter-spacing="4">
    <textPath href="#bottomArch" startOffset="50%" text-anchor="middle">
      MAHARASHTRA • ESTD. 1990s
    </textPath>
  </text>

  <!-- Inner Seal Elements -->
  <!-- Scales of Justice -->
  <g transform="translate(250, 195)">
    <!-- Central Pillar -->
    <path d="M -4,-85 L 4,-85 L 3,35 L -3,35 Z" fill="url(#navyGrad)"/>
    <circle cx="0" cy="-85" r="7" fill="url(#goldGrad)"/>
    <circle cx="0" cy="-45" r="4" fill="url(#goldGrad)"/>
    
    <!-- Balance Beam -->
    <path d="M -90,-65 L 90,-65 L 85,-60 L -85,-60 Z" fill="url(#navyGrad)"/>
    
    <!-- Left Pan Strings & Pan -->
    <line x1="-80" y1="-60" x2="-105" y2="-15" stroke="#1B2D54" stroke-width="2.5"/>
    <line x1="-80" y1="-60" x2="-55" y2="-15" stroke="#1B2D54" stroke-width="2.5"/>
    <path d="M -115,-15 Q -80,15 -45,-15 Z" fill="url(#goldGrad)" stroke="#1B2D54" stroke-width="2"/>
    
    <!-- Right Pan Strings & Pan -->
    <line x1="80" y1="-60" x2="55" y2="-15" stroke="#1B2D54" stroke-width="2.5"/>
    <line x1="80" y1="-60" x2="105" y2="-15" stroke="#1B2D54" stroke-width="2.5"/>
    <path d="M 45,-15 Q 80,15 115,-15 Z" fill="url(#goldGrad)" stroke="#1B2D54" stroke-width="2"/>

    <!-- Auspicious Swastika Symbol -->
    <g transform="translate(0, 10) scale(0.7)">
      <path d="M 0,-15 L 0,15 M -15,0 L 15,0 M -15,-15 L -15,0 M 15,0 L 15,15 M 0,-15 L 15,-15 M -15,15 L 0,15" stroke="#A81D24" stroke-width="4.5" fill="none" stroke-linecap="square"/>
    </g>

    <!-- Side Floral Sprigs -->
    <path d="M -125,-10 Q -140,-35 -115,-55 Q -105,-35 -125,-10" fill="#A81D24"/>
    <circle cx="-132" cy="-45" r="5" fill="#A81D24"/>
    <circle cx="-118" cy="-58" r="5" fill="#A81D24"/>
    <circle cx="-105" cy="-40" r="5" fill="#A81D24"/>

    <path d="M 125,-10 Q 140,-35 115,-55 Q 105,-35 125,-10" fill="#A81D24"/>
    <circle cx="132" cy="-45" r="5" fill="#A81D24"/>
    <circle cx="118" cy="-58" r="5" fill="#A81D24"/>
    <circle cx="105" cy="-40" r="5" fill="#A81D24"/>
  </g>

  <!-- Handshake Emblem at Bottom of Inner Circle -->
  <g transform="translate(250, 340) scale(1.1)">
    <!-- Base Ribbon / Background -->
    <path d="M -120,-20 Q 0,45 120,-20 L 110,35 Q 0,75 -110,35 Z" fill="url(#navyGrad)"/>
    
    <!-- Handshake Outline in Gold/White -->
    <!-- Left Sleeve -->
    <path d="M -90,-10 L -45,-5 L -50,22 L -95,15 Z" fill="#A81D24" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Right Sleeve -->
    <path d="M 90,-10 L 45,-5 L 50,22 L 95,15 Z" fill="#1B2D54" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Clasping Hands -->
    <!-- Left Hand Thumb & Fingers -->
    <path d="M -45,-5 Q -25,-18 -10,0 Q -25,25 -45,15 Z" fill="#F2D06B" stroke="#0B1528" stroke-width="2"/>
    <!-- Right Hand Clasp -->
    <path d="M 45,-5 Q 25,-18 0,5 Q 15,22 45,15 Z" fill="#F2D06B" stroke="#0B1528" stroke-width="2"/>
    <path d="M -15,0 L 15,10 M -12,6 L 12,16 M -8,12 L 8,22" stroke="#0B1528" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
